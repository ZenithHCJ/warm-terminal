name: Update theme previews

on:
  push:
    branches: [main]
    paths:
      - 'themes/**.json'
      - 'scripts/gen-preview.js'
      - 'package.json'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # SVG → PNG 需要 rsvg-convert
      - name: Install librsvg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      # 图标是 Nerd Font 私有区字符，装一个才有图标而不是方块
      - name: Install Nerd Font (JetBrainsMono NF)
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o /tmp/jb.zip \
            https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
          unzip -q -o /tmp/jb.zip -d ~/.local/share/fonts
          fc-cache -f > /dev/null
          fc-list | grep -ci "jetbrains" || true

      # 与本地 `npm run preview` 使用同一份字体串，保证产物一致
      - name: Generate SVG previews
        run: npm run preview --silent

      - name: Render overview.png
        run: |
          rsvg-convert -z 2 -b '#f6f4ef' \
            screenshots/overview.svg -o screenshots/overview.png
          file screenshots/overview.png

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "预览图无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore(preview): 重新生成主题预览图 [skip ci]"
          git push
